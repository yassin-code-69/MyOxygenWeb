<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6FDF9"/>
    </radialGradient>
    <!-- Bottle Bottle Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5DDC90"/>
      <stop offset="35%" stop-color="#82E4AA"/>
      <stop offset="70%" stop-color="#4CAF7D"/>
      <stop offset="100%" stop-color="#2C7A52"/>
    </linearGradient>
    <linearGradient id="bottleBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDFBF3"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#059669" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="20" fill="url(#cardBg)"/>

  <!-- Soft Shadow Under Bottle -->
  <ellipse cx="200" cy="345" rx="85" ry="16" fill="#000000" opacity="0.06"/>
  <ellipse cx="200" cy="342" rx="65" ry="10" fill="#059669" opacity="0.12"/>

  <!-- Bottle Group -->
  <g filter="url(#bottleShadow)">
    <!-- Ribbed Screw Cap -->
    <rect x="156" y="55" width="88" height="36" rx="10" fill="url(#capGrad)"/>
    <!-- Cap Ridges -->
    <line x1="168" y1="58" x2="168" y2="88" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="178" y1="58" x2="178" y2="88" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="188" y1="58" x2="188" y2="88" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="200" y1="58" x2="200" y2="88" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5"/>
    <line x1="212" y1="58" x2="212" y2="88" stroke="#2C7A52" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="222" y1="58" x2="222" y2="88" stroke="#2C7A52" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="232" y1="58" x2="232" y2="88" stroke="#2C7A52" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Bottle Neck Ring -->
    <rect x="150" y="88" width="100" height="12" rx="4" fill="#E2E8F0"/>
    <rect x="154" y="90" width="92" height="8" rx="3" fill="#FFFFFF"/>

    <!-- Bottle Main Body (Smooth Curved Medicine Container) -->
    <path d="M142 100C132 105 125 118 125 132V305C125 320 137 332 152 332H248C263 332 275 320 275 305V132C275 118 268 105 258 100H142Z" fill="url(#bottleBodyGrad)"/>
    
    <!-- Bottle Specular Highlight Stripe -->
    <path d="M145 106C140 110 138 118 138 126V315H150V126C150 118 148 110 145 106Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Main Label Area -->
    <rect x="130" y="128" width="140" height="185" rx="10" fill="url(#labelGrad)"/>
    <!-- Gold Trim Top & Bottom of Label -->
    <rect x="130" y="128" width="140" height="5" fill="url(#goldRibbon)"/>
    <rect x="130" y="308" width="140" height="5" rx="2" fill="url(#goldRibbon)"/>

    <!-- Brand Subtitle / Header -->
    <text x="200" y="150" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="1.2">
      MY OXYGEN CARE
    </text>

    <!-- Botanical Leaf & Motherhood Emblem -->
    <g transform="translate(200, 182)">
      <circle cx="0" cy="0" r="22" fill="#EDFBF3" stroke="#82E4AA" stroke-width="1.5"/>
      <!-- Green Sprout Leaf Icon -->
      <path d="M-6 8C-6 8 -12 -2 -2 -8C4 -12 12 -6 8 4C5 8 0 8 -6 8Z" fill="#4CAF7D"/>
      <path d="M0 6C0 6 6 0 2 -6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M2 6C4 2 12 1 12 1" stroke="#5DDC90" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Product Title on Label -->
    <text x="200" y="222" font-family="'Poppins', sans-serif" font-size="14.5" font-weight="800" fill="#1F2937" text-anchor="middle" letter-spacing="-0.3">
      Pregnancy
    </text>
    <text x="200" y="238" font-family="'Poppins', sans-serif" font-size="14.5" font-weight="800" fill="#059669" text-anchor="middle" letter-spacing="-0.3">
      Vitamin
    </text>

    <!-- Formula Subtitle -->
    <text x="200" y="255" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#6B7280" text-anchor="middle">
      Folic Acid • DHA • Iron
    </text>

    <!-- Dosage / Count Pill Badge -->
    <rect x="155" y="270" width="90" height="18" rx="9" fill="#10B981" fill-opacity="0.15"/>
    <text x="200" y="282.5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">
      60 VEG CAPSULES
    </text>

    <!-- Bottom Verification Tag -->
    <text x="200" y="300" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#9CA3AF" text-anchor="middle">
      100% SAFE &amp; CERTIFIED
    </text>
  </g>
</svg>
