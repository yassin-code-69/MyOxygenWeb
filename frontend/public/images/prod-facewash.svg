<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </radialGradient>
    <!-- Cosmetic Tube Gradient: Pastel Mint Green -->
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="25%" stop-color="#D1FAE5"/>
      <stop offset="65%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="tubeShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#059669" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="400" rx="20" fill="url(#cardBg)"/>

  <!-- Soft Shadow Under Tube & Cap -->
  <ellipse cx="200" cy="348" rx="70" ry="14" fill="#000000" opacity="0.07"/>
  <ellipse cx="200" cy="346" rx="55" ry="9" fill="#059669" opacity="0.12"/>

  <!-- Tube Group -->
  <g filter="url(#tubeShadow)">
    <!-- Top Crimped Seal of Tube -->
    <path d="M142 55H258V68C258 70 255 72 252 72H148C145 72 142 70 142 68V55Z" fill="#34D399"/>
    <!-- Crimp Lines -->
    <line x1="150" y1="56" x2="150" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="160" y1="56" x2="160" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="170" y1="56" x2="170" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="180" y1="56" x2="180" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="190" y1="56" x2="190" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="200" y1="56" x2="200" y2="70" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="210" y1="56" x2="210" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="220" y1="56" x2="220" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="230" y1="56" x2="230" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="240" y1="56" x2="240" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="250" y1="56" x2="250" y2="70" stroke="#059669" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Tube Body (Tapered Shape) -->
    <!-- Top width: 116px (142 to 258), Bottom width: 90px (155 to 245) -->
    <path d="M142 68C142 68 144 180 155 285H245C256 180 258 68 258 68H142Z" fill="url(#tubeGrad)"/>
    
    <!-- Specular Highlight Curve on Tube -->
    <path d="M152 74C152 74 154 180 162 280H172C164 180 162 74 162 74H152Z" fill="#FFFFFF" opacity="0.45"/>

    <!-- Tube Branding Content -->
    <text x="200" y="112" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="1.5">
      MY OXYGEN DERMA
    </text>

    <!-- Botanical Drop / Cleanse Emblem -->
    <g transform="translate(200, 142)">
      <circle cx="0" cy="0" r="18" fill="#FFFFFF" fill-opacity="0.85"/>
      <!-- Water Drop & Leaf -->
      <path d="M0 -10C-5 -2 -8 2 -8 6C-8 10.4 -4.4 14 0 14C4.4 14 8 10.4 8 6C8 2 5 -2 0 -10Z" fill="#10B981"/>
      <path d="M-2 4C-2 4 0 10 4 8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Product Title -->
    <text x="200" y="185" font-family="'Poppins', sans-serif" font-size="14.5" font-weight="800" fill="#064E3B" text-anchor="middle" letter-spacing="-0.2">
      Face Wash
    </text>
    <text x="200" y="200" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#047857" text-anchor="middle">
      (Skin Care)
    </text>

    <!-- Benefit Badges -->
    <rect x="162" y="215" width="76" height="15" rx="7.5" fill="#FFFFFF" fill-opacity="0.75"/>
    <text x="200" y="225.5" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">
      GENTLE FOAMING
    </text>

    <text x="200" y="248" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#065F46" text-anchor="middle">
      With Tea Tree &amp; Cica
    </text>
    <text x="200" y="262" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#047857" text-anchor="middle">
      100 ml / 3.4 fl. oz.
    </text>

    <!-- Tube Shoulder Ring -->
    <rect x="152" y="285" width="96" height="8" rx="2" fill="#E2E8F0"/>

    <!-- Bottom Flip-Top Screw Cap (White Matte Cylinder) -->
    <rect x="154" y="293" width="92" height="42" rx="10" fill="url(#capGrad)"/>
    <!-- Flip Lid Groove -->
    <line x1="156" y1="315" x2="244" y2="315" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="190" y="312" width="20" height="6" rx="3" fill="#E2E8F0"/>
  </g>
</svg>
