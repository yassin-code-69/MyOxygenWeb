services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-oxygen-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.adwxwwcnxpcuwkjheqaj:MyOxygenSecurePass2026!@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:MyOxygenSecurePass2026!@db.adwxwwcnxpcuwkjheqaj.supabase.co:5432/postgres}
      - JWT_SECRET=${JWT_SECRET:-my_oxygen_super_secure_jwt_secret_token_2026_at_least_32_chars!}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:4000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: my-oxygen-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
